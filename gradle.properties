# Sized so the dev laptop (6 cores / 12 threads, 16 GB, also a desktop) stays usable while building:
# the daemon runs at low CPU priority (it and everything it forks, Kotlin daemon and test JVMs
# included, are niced), at most 3 workers (so at most 3 Robolectric JVMs at once), and Gradle plus
# the Kotlin daemon are capped around 5 GB. Idle daemons exit after 15 minutes instead of 3 hours.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:ParallelGCThreads=3 -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:ParallelGCThreads=3
org.gradle.workers.max=3
org.gradle.priority=low
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Generating the baseline profile runs instrumented tests against the app; by default they uninstall
# it afterwards, wiping its data (login included). Leave it installed.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# The release, shared by the phone and the watch app. CI checks a vX.Y.Z tag against the name.
# The watch's version code is 1_000_000 + this one: Play needs every upload's code to be new.
xmuks.versionName=0.0.48
xmuks.versionCode=48
