# Sized for the dev laptop (6 cores / 12 threads, 16 GB, also a desktop): one worker per physical
# core, Gradle + one Kotlin daemon around 6 GB.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=6
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Generating the baseline profile runs instrumented tests against the app; by default they uninstall
# it afterwards, wiping its data (login included). Leave it installed.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# The release, shared by the phone and the watch app. CI checks a vX.Y.Z tag against the name.
# The watch's version code is 1_000_000 + this one: Play needs every upload's code to be new.
xmuks.versionName=0.0.32
xmuks.versionCode=32
